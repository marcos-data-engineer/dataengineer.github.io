<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="url(#bg2)"/>
  <rect width="800" height="420" fill="url(#grid2)"/>

  <!-- Terminal Window -->
  <rect x="40" y="30" width="720" height="360" rx="12" fill="#0b111e" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="38" rx="12" fill="#1e293b"/>
  <circle cx="64" cy="49" r="6" fill="#ef4444"/>
  <circle cx="84" cy="49" r="6" fill="#f59e0b"/>
  <circle cx="104" cy="49" r="6" fill="#10b981"/>
  <text x="130" y="54" fill="#cbd5e1" font-family="monospace" font-size="13">bash — gdrive-sync.sh (systemd user daemon)</text>

  <!-- Diagram boxes inside terminal -->
  <rect x="75" y="100" width="180" height="95" rx="10" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <text x="165" y="130" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">LINUX LOCAL DIR</text>
  <text x="165" y="155" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">inotifywait (-m -r)</text>
  <text x="165" y="176" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Debounce: 5s + Lock</text>

  <!-- Bidirectional arrows -->
  <path d="M 265 135 L 525 135" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="525,130 537,135 525,140" fill="#10b981"/>
  <path d="M 535 162 L 275 162" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="275,157 263,162 275,167" fill="#38bdf8"/>

  <rect x="315" y="118" width="170" height="60" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="144" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">rclone bisync</text>
  <text x="400" y="164" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">--conflict-resolve newer</text>

  <rect x="545" y="100" width="180" height="95" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="635" y="130" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">GOOGLE DRIVE API</text>
  <text x="635" y="155" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">OAuth2 Client</text>
  <text x="635" y="176" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Scheduled Pull &amp; Push</text>

  <!-- Terminal Output Logs -->
  <rect x="75" y="220" width="650" height="140" rx="8" fill="#070a12" stroke="rgba(148,163,184,0.15)"/>
  <text x="95" y="248" fill="#10b981" font-family="monospace" font-size="13">$ systemctl --user status gdrive-sync@documentos.service</text>
  <text x="95" y="272" fill="#e2e8f0" font-family="monospace" font-size="12">● gdrive-sync@documentos.service - Google Drive Bidirectional Sync</text>
  <text x="95" y="294" fill="#34d399" font-family="monospace" font-size="12">   Active: active (running) | Watchdog: inotifywait PID 4182</text>
  <text x="95" y="316" fill="#94a3b8" font-family="monospace" font-size="12">   [INFO] Event detected: MODIFY -&gt; Debounce 5s -&gt; rclone bisync OK</text>
  <text x="95" y="338" fill="#38bdf8" font-family="monospace" font-size="12">   [SEC]  User-level isolation | Log rotation: 50MB max</text>
</svg>
