<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg_ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid_ai" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(16,185,129,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="url(#bg_ai)"/>
  <rect width="800" height="420" fill="url(#grid_ai)"/>

  <!-- Main Card -->
  <rect x="50" y="35" width="700" height="350" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <rect x="50" y="35" width="700" height="48" rx="16" fill="rgba(16,185,129,0.15)"/>
  <text x="400" y="66" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">AUTONOMOUS AI AGENTS &amp; SECOND BRAIN KNOWLEDGE BASE</text>

  <!-- Left Column: Knowledge Ingestion -->
  <rect x="80" y="115" width="300" height="85" rx="10" fill="#1e293b" stroke="rgba(148,163,184,0.3)"/>
  <text x="230" y="145" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Curated Research &amp; Sources</text>
  <text x="230" y="172" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">ArXiv Papers · Meta AI (JEPA) · Multi-LLMs</text>

  <!-- Right Column: RAG & Synthesis -->
  <rect x="420" y="115" width="300" height="85" rx="10" fill="#1e293b" stroke="rgba(148,163,184,0.3)"/>
  <text x="570" y="145" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Grounded Embeddings &amp; RAG</text>
  <text x="570" y="172" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">BGE-M3 · Vector Store · Semantic Search</text>

  <path d="M 230 200 L 230 230" stroke="#10b981" stroke-width="2"/>
  <path d="M 570 200 L 570 230" stroke="#10b981" stroke-width="2"/>

  <!-- Bottom Panel: Reasoning & Outputs -->
  <rect x="80" y="230" width="640" height="125" rx="12" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="262" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">3. Autonomous Synthesis &amp; Technical Artifacts</text>
  <text x="400" y="292" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">Hypothesis Testing · World Models vs Autoregressive Architecture</text>
  <text x="400" y="322" fill="#6ee7b7" font-family="monospace" font-size="12" text-anchor="middle">● Verifiable Technical Citations &amp; Automated Knowledge Graphs</text>
</svg>
