<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071510"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg3)"/>

  <!-- App Container -->
  <rect x="45" y="30" width="710" height="360" rx="14" fill="#0f172a" stroke="rgba(16,185,129,0.35)" stroke-width="1.5"/>
  
  <!-- Top Bar -->
  <text x="80" y="72" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold">🌱 EcoTrack — CO2e Multimodal Route Analyzer</text>
  <rect x="590" y="52" width="130" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
  <text x="655" y="70" fill="#6ee7b7" font-family="monospace" font-size="12" text-anchor="middle">Vue.js 3 + Vite</text>

  <!-- Route Bar -->
  <rect x="80" y="95" width="640" height="48" rx="8" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
  <text x="100" y="124" fill="#e2e8f0" font-family="monospace" font-size="13">📍 Brasília, DF  ───────►  📍 Goiânia, GO   |   OSRM API: 209.4 km</text>

  <!-- Comparison Bars -->
  <text x="80" y="178" fill="#94a3b8" font-family="monospace" font-size="12">Bicicleta / A Pé</text>
  <rect x="230" y="164" width="20" height="18" rx="4" fill="#10b981"/>
  <text x="260" y="178" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">0.0 kg CO2e (Eco Choice)</text>

  <text x="80" y="218" fill="#94a3b8" font-family="monospace" font-size="12">Transporte Público</text>
  <rect x="230" y="204" width="130" height="18" rx="4" fill="#34d399"/>
  <text x="370" y="218" fill="#e2e8f0" font-family="monospace" font-size="12">14.2 kg CO2e (-68%)</text>

  <text x="80" y="258" fill="#94a3b8" font-family="monospace" font-size="12">Motocicleta</text>
  <rect x="230" y="244" width="210" height="18" rx="4" fill="#f59e0b"/>
  <text x="450" y="258" fill="#e2e8f0" font-family="monospace" font-size="12">23.8 kg CO2e</text>

  <text x="80" y="298" fill="#94a3b8" font-family="monospace" font-size="12">Carro Particular</text>
  <rect x="230" y="284" width="360" height="18" rx="4" fill="#ef4444"/>
  <text x="600" y="298" fill="#fca5a5" font-family="monospace" font-size="12">44.6 kg CO2e</text>

  <!-- Bottom Sustainability Metric -->
  <rect x="80" y="330" width="640" height="40" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)"/>
  <text x="400" y="355" fill="#6ee7b7" font-family="monospace" font-size="13" text-anchor="middle">API Integration: OpenStreetMap + Nominatim + OSRM Routing Engine</text>
</svg>
